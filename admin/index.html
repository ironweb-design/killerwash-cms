    <style>
      body{
        background:
          radial-gradient(150% 100% at 50% 118%, rgba(79,156,249,0.14), rgba(79,156,249,0) 60%),

        background-attachment: fixed !important;
      }

      #nc-root,
      #nc-root > div:first-child,
      [class*="AppMainContainer"],
      [class*="AppWrapper"],
      [class*="AppMain"]{

      #nc-root form button{
        background:#4f9cf9 !important; color:#04213f !important;
        font-weight:800 !important; border:none !important; border-radius:12px !important;

      }

          box-sizing: border-box !important;
        }
